<!doctype html>
<!--
  index.html — Beredskap app shell. Classic <script> tags in dependency order so
  the app runs unchanged from file:// and from any static host. No network calls:
  the Content-Security-Policy below forbids them (connect-src 'none').
-->
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>Beredskap</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/presenter.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <a id="skip-link" class="skip-link" href="#main">Skip to content</a>
  <header id="app-header" class="app-header"></header>
  <div id="storage-banner" class="banner banner--warn" role="alert" hidden></div>
  <main id="main" class="main" tabindex="-1"></main>

  <!-- core -->
  <script src="js/core/namespace.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/core/dom.js"></script>
  <!-- data -->
  <script src="js/data/options.js"></script>
  <script src="js/data/roles.js"></script>
  <script src="js/data/environments.js"></script>
  <!-- graphics -->
  <script src="js/graphics/icons.js"></script>
  <!-- scenarios -->
  <script src="js/scenarios/_registry.js"></script>
  <!-- ui -->
  <script src="js/ui/router.js"></script>
  <script src="js/ui/dialog.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/ui/library.js"></script>
  <script src="js/ui/wizard.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/ui/history.js"></script>
  <!-- boot -->
  <script src="js/app.js"></script>
</body>
</html>
