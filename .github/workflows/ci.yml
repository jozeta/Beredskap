name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS runner: the layout tests measure text against the fonts the app is designed for
    # (Segoe UI / system-ui / Helvetica). Ubuntu only has wider fallback fonts, so text overflows there.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Lint (ESLint, incl. the unsafe-DOM-sink rules)
        run: npx --yes eslint@10.14.0 .
      - name: Source scan and in-browser test suite (tests.html, headless Chrome over HTTP)
        run: bash tests/test.sh
